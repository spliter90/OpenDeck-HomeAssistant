[package]
name = "opendeck-homeassistant"
version = "0.2.0"
edition = "2024"
description = "OpenAction/OpenDeck plugin for Home Assistant entity status and service control"
license = "MIT"

[dependencies]
base64 = "0.22"
futures-util = "0.3"
log = "0.4"
openaction = "2.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
